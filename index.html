<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Save the Date</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Story+Script&display=swap" rel="stylesheet">

        <style>
            * {
                box-sizing: border-box;
            }

            body {
                /* background-color: #FFB6A6; */
                background: linear-gradient(135deg, #FFE8D6 0%, #FFB6A6 50%, #FFD6C9 100%);
                margin: 0;
                padding: 0;
            }

            h1 {
                font-size: clamp(4em, 12vw, 8em);
                margin-bottom: 0px;
                margin-top: 2rem;
                text-align: center;
                color: #8C3A4A;
                text-shadow: 1px 1px 0px rgba(255, 255, 255, 0.6);
            }

            h2 {
                font-size: clamp(2em, 6vw, 4em);
                margin-top: 0px;
                text-align: center; 
                letter-spacing: 0.03em;
                color: #B5495B;
            }

            .story-script-regular {
                font-family: "Story Script", sans-serif;
                font-weight: 400;
                font-style: normal;
            }

            .jessie-and-daniel-image {
                height: 50vh;
                animation-name: tilt-shaking;
                animation-duration: 2s;
                animation-iteration-count: infinite;
                animation-timing-function: ease-in-out;
                filter: drop-shadow(0 8px 24px rgba(0,0,0,0.15))
            }

            .jessie-and-daniel-image:hover{
                animation-duration: 0.5s;
            }

            .container {
                display: flex;
                justify-content: center;
                align-items: center;
                flex-direction: column;
                min-height: 100dvh;
                padding: 2rem 1rem;
            }

            @keyframes tilt-shaking {
                0% { transform: rotate(0deg); }
                25% { transform: rotate(5deg); }    
                50% { transform: rotate(0deg); }
                75% { transform: rotate(-5deg); }
                100% { transform: rotate(0deg); }
            }

            .divider {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 60%;
                max-width: 300px;
                margin: 0.5rem auto;
            }

            .divider-line {
                flex: 1;
                height: 1px;
                background: #B5495B;
                opacity: 0.4;
            }

            .divider-dot {
                margin: 0 1rem;
                color: #B5495B;
                font-size: 1.2rem;
            }
        </style>
    </head>
    
    <body>
        <div class="container">
            <img src="jessieanddaniel.png" class="jessie-and-daniel-image" alt="Portrait of Jessie and Daniel">
            <section>
                <h1 class="story-script-regular">Save the Date</h1>
                <div class="divider">
                    <span class="divider-line"></span>
                    <span class="divider-dot">♥</span>
                    <span class="divider-line"></span>
                </div>
                <h2 class="story-script-regular">29.4.2028 - Auckland, NZ</h2>
            </section>
        </div>
    </body>
</html>
